<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KNIHOMOL 📚</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#FF6B6B">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --dark: #292F36;
            --gradient: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%);
            --bg-color: #f5f7fa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #111;
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 9:16 Mobilní kontejner přes celou obrazovku */
        .app-container {
            width: 100vw;
            height: 100vh;
            max-width: 480px;
            max-height: 920px;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 481px) {
            .app-container {
                height: 90vh;
                border-radius: 30px;
                box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            }
        }

        header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            flex-shrink: 0;
        }
        .logo { font-size: 20px; font-weight: 700; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .admin-icon-btn {
            background: #FFF3CD;
            border: none;
            width: 36px; height: 36px;
            border-radius: 50%;
            color: #856404;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            font-size: 14px;
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 100px;
        }

        .tab-content { display: none; flex-direction: column; gap: 15px; }
        .tab-content.active { display: flex; }

        /* Plovoucí spodní mobilní lišta (Bottom Nav) */
        .bottom-nav {
            position: absolute;
            bottom: 16px;
            left: 16px;
            right: 16px;
            width: auto;
            height: 65px;
            background: white;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-radius: 22px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            z-index: 100;
            border: 1px solid rgba(0,0,0,0.04);
        }

        .nav-item {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #999;
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            flex: 1;
        }

        .nav-item i {
            font-size: 18px;
            transition: 0.2s;
        }

        .nav-item.active {
            color: #FF6B6B;
        }

        .nav-item.active i {
            transform: translateY(-2px);
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid rgba(0,0,0,0.02);
        }

        .books-grid { display: flex; flex-direction: column; gap: 12px; }
        .book-card {
            background: white;
            border-radius: 14px;
            padding: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.03);
            display: flex;
            gap: 14px;
            border: 1px solid #eee;
        }
        .book-cover { width: 60px; height: 90px; border-radius: 8px; object-fit: cover; background: #eee; flex-shrink: 0; }
        .book-details { flex: 1; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
        .book-title { font-size: 14px; font-weight: 700; color: var(--dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .book-author { font-size: 12px; color: #666; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .tag { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 4px; background: #E3F2FD; color: #1976D2; }
        .tag-genre { background: #FFF9C4; color: #F57F17; margin-left: 4px; }

        .rating-stars { color: #FFC107; font-size: 11px; display: inline-flex; gap: 2px; margin: 2px 0; cursor: pointer; }

        .progress-container { width: 100%; height: 6px; background: #f0f2f5; border-radius: 3px; overflow: hidden; margin: 4px 0; }
        .progress-fill { height: 100%; background: var(--gradient); border-radius: 3px; }

        .input-field {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 2px solid #eee;
            font-size: 13px;
            outline: none;
            background: #fafafa;
        }
        .input-field:focus { border-color: var(--primary); background: white; }

        .btn-main {
            background: var(--gradient);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }

        .icon-btn {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            width: 28px; height: 28px;
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #6c757d;
            font-size: 12px;
        }
        .icon-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }

        .search-results-list { max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-top: 5px; }
        .search-result-item { display: flex; align-items: center; gap: 10px; padding: 8px; background: #fafafa; border: 1px solid #eee; border-radius: 8px; cursor: pointer; }

        .profile-avatar {
            width: 80px; height: 80px; border-radius: 50%; object-fit: cover;
            background: var(--gradient); color: white; font-size: 28px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 10px auto; border: 3px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: relative;
        }
        .admin-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .admin-table th, .admin-table td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; }
        .admin-table th { color: #888; background: #f8f9fa; }

        /* Modální okno pro úpravu knihy */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-card {
            background: white;
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-height: 90vh;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Horní lišta -->
        <header>
            <div class="logo"><i class="fas fa-book-open"></i> KNIHOMOL</div>
            <button class="admin-icon-btn" onclick="tryOpenAdmin(this)" title="Admin"><i class="fas fa-shield-alt"></i></button>
        </header>

        <!-- Hlavní obsah -->
        <main>
            <!-- DOMŮ -->
            <div id="tab-domu" class="tab-content active">
                <div class="card" style="background: var(--gradient); color: white;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <h2 id="welcome-msg" style="font-size: 18px; font-weight: 700;">Ahoj, Čtenáři!</h2>
                            <p style="font-size: 12px; opacity: 0.9;">Ponoř se do svých příběhů.</p>
                        </div>
                        <button class="btn-main" style="background: white; color: var(--primary); box-shadow: none; padding: 8px 12px; font-size: 11px;" onclick="switchTab('pridat', document.querySelectorAll('.nav-item')[2])"><i class="fas fa-plus"></i> Přidat</button>
                    </div>
                </div>

                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <div style="font-size: 10px; font-weight: 700; color: #888; text-transform: uppercase;">Čtenářská výzva</div>
                            <div style="font-size: 18px; font-weight: 700; margin-top: 2px;"><span id="goal-current">0</span> / <span id="goal-total">12</span> knih</div>
                        </div>
                        <button class="icon-btn" onclick="editGoal()"><i class="fas fa-pen"></i></button>
                    </div>
                    <div class="progress-container"><div class="progress-fill" id="goal-bar" style="width: 0%;"></div></div>
                    <div style="font-size: 10px; color: #888; text-align: right;" id="goal-pct">Splněno 0 %</div>
                </div>

                <div>
                    <div style="font-size: 14px; font-weight: 700; margin-bottom: 10px;"><i class="fas fa-fire" style="color: var(--primary);"></i> Právě rozečteno</div>
                    <div id="home-grid" class="books-grid"></div>
                </div>
            </div>

            <!-- KNIHOVNA -->
            <div id="tab-knihovna" class="tab-content">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div style="font-size: 15px; font-weight: 700;"><i class="fas fa-bookmark" style="color: var(--primary);"></i> Knihovna</div>
                    <select id="filter-status" class="input-field" style="width: auto; padding: 6px 10px; font-size: 11px;" onchange="renderBooks()">
                        <option value="all">Vše</option>
                        <option value="reading">Čtu</option>
                        <option value="tbr">Chci číst</option>
                        <option value="read">Přečteno</option>
                    </select>
                </div>
                <div id="library-grid" class="books-grid"></div>
            </div>

            <!-- PŘIDAT -->
            <div id="tab-pridat" class="tab-content">
                <div style="font-size: 15px; font-weight: 700;"><i class="fas fa-magic" style="color: var(--primary);"></i> Přidat knihu</div>
                
                <div class="card">
                    <label style="font-size: 10px; font-weight: 700; color: #888;">HLEDAT V OPEN LIBRARY</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="search-input" class="input-field" placeholder="Název nebo autor...">
                        <button class="btn-main" style="padding: 10px 14px;" onclick="searchOL()"><i class="fas fa-search"></i></button>
                    </div>
                    <div id="search-results" class="search-results-list" style="display:none;"></div>
                </div>

                <div class="card">
                    <div style="font-size: 12px; font-weight: 700; margin-bottom: 4px;">Ruční přidání:</div>
                    <div style="display: flex; flex-direction: column; gap: 10px;">
                        <input type="text" id="m-title" class="input-field" placeholder="Název knihy *">
                        <input type="text" id="m-author" class="input-field" placeholder="Autor *">
                        <input type="text" id="m-cover" class="input-field" placeholder="URL obálky (nepovinné)">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                            <select id="m-genre" class="input-field" style="font-size: 11px;">
                                <option value="Beletrie">Beletrie</option>
                                <option value="Fantasy">Fantasy</option>
                                <option value="Sci-Fi">Sci-Fi</option>
                                <option value="Thriller / Krimi">Thriller / Krimi</option>
                                <option value="Romantika">Romantika</option>
                                <option value="Historie">Historie</option>
                                <option value="Osobní rozvoj">Osobní rozvoj</option>
                            </select>
                            <input type="number" id="m-pages" class="input-field" value="300" min="1" placeholder="Počet stran">
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                            <select id="m-status" class="input-field" style="font-size: 11px;">
                                <option value="reading">Právě čtu</option>
                                <option value="tbr">Chci číst</option>
                                <option value="read">Přečteno</option>
                            </select>
                            <select id="m-rating" class="input-field" style="font-size: 11px;">
                                <option value="0">Hodnocení</option>
                                <option value="5">⭐⭐⭐⭐⭐ (5)</option>
                                <option value="4">⭐⭐⭐⭐ (4)</option>
                                <option value="3">⭐⭐⭐ (3)</option>
                                <option value="2">⭐⭐ (2)</option>
                                <option value="1">⭐ (1)</option>
                            </select>
                        </div>
                        <button class="btn-main" onclick="saveManual()"><i class="fas fa-check"></i> Uložit knihu</button>
                    </div>
                </div>
            </div>

            <!-- PROFIL -->
            <div id="tab-profil" class="tab-content">
                <div style="font-size: 15px; font-weight: 700;"><i class="fas fa-user" style="color: var(--primary);"></i> Profil</div>
                <div class="card" style="text-align: center;">
                    <div class="profile-avatar" id="avatar-img-el">Č</div>
                    <div style="text-align: left; display: flex; flex-direction: column; gap: 10px;">
                        <div>
                            <label style="font-size: 9px; font-weight: 700; color: #888;">JMÉNO</label>
                            <input type="text" id="prof-name" class="input-field">
                        </div>
                        <div>
                            <label style="font-size: 9px; font-weight: 700; color: #888;">BIO</label>
                            <textarea id="prof-bio" class="input-field" rows="2" style="resize: none;"></textarea>
                        </div>
                        <div>
                            <label style="font-size: 9px; font-weight: 700; color: #888;">URL OBRÁZKU</label>
                            <input type="text" id="prof-avatar-url" class="input-field" placeholder="https://...">
                        </div>
                        <button class="btn-main" onclick="saveProfile()"><i class="fas fa-save"></i> Uložit profil</button>
                    </div>
                </div>
            </div>

            <!-- ADMIN -->
            <div id="tab-admin" class="tab-content">
                <div style="font-size: 15px; font-weight: 700;"><i class="fas fa-shield-alt" style="color: #ffc107;"></i> Admin</div>
                <div class="card">
                    <div style="font-size: 10px; font-weight: 700; color: #888;">NÁVŠTĚVNOST</div>
                    <div style="font-size: 22px; font-weight: 700; color: var(--primary);" id="admin-visits">0</div>
                </div>
                <div class="card">
                    <div style="font-size: 13px; font-weight: 700; margin-bottom: 8px;">Poslední aktivity</div>
                    <table class="admin-table">
                        <thead><tr><th>Čas</th><th>Uživatel</th></tr></thead>
                        <tbody id="admin-logs-body"></tbody>
                    </table>
                </div>
            </div>
        </main>

        <!-- Plovoucí spodní navigační lišta -->
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="switchTab('domu', this)">
                <i class="fas fa-home"></i>
                <span>Domů</span>
            </button>
            <button class="nav-item" onclick="switchTab('knihovna', this)">
                <i class="fas fa-layer-group"></i>
                <span>Knihovna</span>
            </button>
            <button class="nav-item" onclick="switchTab('pridat', this)">
                <i class="fas fa-plus-circle"></i>
                <span>Přidat</span>
            </button>
            <button class="nav-item" onclick="switchTab('profil', this)">
                <i class="fas fa-user"></i>
                <span>Profil</span>
            </button>
        </nav>

        <!-- Modální okno pro úpravu knihy -->
        <div id="edit-modal" class="modal-overlay">
            <div class="modal-card">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div style="font-size: 15px; font-weight: 700;"><i class="fas fa-pen" style="color: var(--primary);"></i> Upravit knihu</div>
                    <button class="icon-btn" onclick="closeEditModal()"><i class="fas fa-times"></i></button>
                </div>
                <input type="hidden" id="edit-index">
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <div>
                        <label style="font-size: 10px; font-weight: 700; color: #888;">NÁZEV</label>
                        <input type="text" id="edit-title" class="input-field">
                    </div>
                    <div>
                        <label style="font-size: 10px; font-weight: 700; color: #888;">AUTOR</label>
                        <input type="text" id="edit-author" class="input-field">
                    </div>
                    <div>
                        <label style="font-size: 10px; font-weight: 700; color: #888;">URL OBÁLKY</label>
                        <input type="text" id="edit-cover" class="input-field">
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                        <div>
                            <label style="font-size: 10px; font-weight: 700; color: #888;">ŽÁNR</label>
                            <select id="edit-genre" class="input-field" style="font-size: 11px;">
                                <option value="Beletrie">Beletrie</option>
                                <option value="Fantasy">Fantasy</option>
                                <option value="Sci-Fi">Sci-Fi</option>
                                <option value="Thriller / Krimi">Thriller / Krimi</option>
                                <option value="Romantika">Romantika</option>
                                <option value="Historie">Historie</option>
                                <option value="Osobní rozvoj">Osobní rozvoj</option>
                            </select>
                        </div>
                        <div>
                            <label style="font-size: 10px; font-weight: 700; color: #888;">CELKEM STRAN</label>
                            <input type="number" id="edit-pages" class="input-field" min="1">
                        </div>
                    </div>
                    <div>
                        <label style="font-size: 10px; font-weight: 700; color: #888;">AKTUÁLNĚ PŘEČTENO STRAN</label>
                        <input type="number" id="edit-current-pages" class="input-field" min="0">
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                        <div>
                            <label style="font-size: 10px; font-weight: 700; color: #888;">STAV</label>
                            <select id="edit-status" class="input-field" style="font-size: 11px;">
                                <option value="reading">Právě čtu</option>
                                <option value="tbr">Chci číst</option>
                                <option value="read">Přečteno</option>
                            </select>
                        </div>
                        <div>
                            <label style="font-size: 10px; font-weight: 700; color: #888;">HODNOCENÍ</label>
                            <select id="edit-rating" class="input-field" style="font-size: 11px;">
                                <option value="0">Bez hodnocení</option>
                                <option value="5">⭐⭐⭐⭐⭐ (5)</option>
                                <option value="4">⭐⭐⭐⭐ (4)</option>
                                <option value="3">⭐⭐⭐ (3)</option>
                                <option value="2">⭐⭐ (2)</option>
                                <option value="1">⭐ (1)</option>
                            </select>
                        </div>
                    </div>
                    <button class="btn-main" style="margin-top: 6px;" onclick="saveEditedBook()"><i class="fas fa-save"></i> Uložit změny</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error:', err));
            });
        }

        let books = JSON.parse(localStorage.getItem('knihomol_books')) || [
            { title: "Hobit", author: "J. R. R. Tolkien", totalPages: 320, currentPage: 120, status: "reading", genre: "Fantasy", rating: 5, cover: "https://covers.openlibrary.org/b/id/8431969-M.jpg" }
        ];
        let targetGoal = parseInt(localStorage.getItem('knihomol_goal')) || 12;

        let profile = JSON.parse(localStorage.getItem('knihomol_user_profile')) || { name: "Vášnivý Čtenář", bio: "Milovník knih.", avatar: "" };
        document.getElementById('welcome-msg').textContent = `Ahoj, ${profile.name}! ✨`;
        document.getElementById('prof-name').value = profile.name;
        document.getElementById('prof-bio').value = profile.bio;
        updateAvatarDisplay(profile.avatar, profile.name);

        let stats = JSON.parse(localStorage.getItem('knihomol_stats')) || { visits: 0, logs: [] };
        stats.visits += 1;
        stats.logs.unshift({ time: new Date().toLocaleTimeString('cs-CZ'), user: "Mobilní uživatel" });
        if(stats.logs.length > 15) stats.logs.pop();
        localStorage.setItem('knihomol_stats', JSON.stringify(stats));

        function switchTab(id, btn) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.bottom-nav .nav-item').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + id).classList.add('active');
            if(btn) btn.classList.add('active');
            if(id === 'admin') loadAdminData();
            renderEverything();
        }

        function tryOpenAdmin(btn) {
            let pin = prompt("Zadej admin PIN:");
            if (pin === "1234") switchTab('admin', btn);
            else if (pin !== null) alert("Nesprávný PIN!");
        }

        function loadAdminData() {
            let statsData = JSON.parse(localStorage.getItem('knihomol_stats')) || { visits: 0, logs: [] };
            document.getElementById('admin-visits').textContent = statsData.visits;
            document.getElementById('admin-logs-body').innerHTML = statsData.logs.map(l => `
                <tr><td>${l.time}</td><td><b>${l.user}</b></td></tr>
            `).join('');
        }

        function renderEverything() {
            renderGoalProgress();
            renderBooks();
        }

        function renderGoalProgress() {
            const finished = books.filter(b => b.status === 'read' || (b.totalPages > 0 && b.currentPage >= b.totalPages)).length;
            document.getElementById('goal-current').textContent = finished;
            document.getElementById('goal-total').textContent = targetGoal;
            let pct = Math.min(100, Math.round((finished / targetGoal) * 100));
            document.getElementById('goal-bar').style.width = pct + '%';
            document.getElementById('goal-pct').textContent = `Splněno ${pct} %`;
        }

        function renderBooks() {
            const filter = document.getElementById('filter-status').value;
            const libraryGrid = document.getElementById('library-grid');
            const homeGrid = document.getElementById('home-grid');

            let filtered = books;
            if(filter !== 'all') filtered = books.filter(b => b.status === filter);

            libraryGrid.innerHTML = filtered.map((b, index) => createBookCardHtml(b, books.indexOf(b))).join('') || '<p style="color:#888; font-size:12px;">Žádné knihy.</p>';
            
            const readingBooks = books.filter(b => b.status === 'reading');
            homeGrid.innerHTML = readingBooks.map((b) => createBookCardHtml(b, books.indexOf(b))).join('') || '<p style="color:#888; font-size:12px;">Právě nečteš žádnou knihu.</p>';
        }

        function createBookCardHtml(b, index) {
            let pct = b.totalPages ? Math.min(100, Math.round((b.currentPage / b.totalPages) * 100)) : 0;
            let starsHtml = '';
            for(let i = 1; i <= 5; i++) {
                starsHtml += `<i class="${i <= (b.rating || 0) ? 'fas' : 'far'} fa-star" onclick="rateBook(${index}, ${i})"></i>`;
            }

            return `
                <div class="book-card">
                    <img src="${b.cover || 'https://via.placeholder.com/60x90?text=?'}" class="book-cover" onerror="this.src='https://via.placeholder.com/60x90?text=Chyba'">
                    <div class="book-details">
                        <div>
                            <div class="book-title">${escapeHtml(b.title)}</div>
                            <div class="book-author">${escapeHtml(b.author)}</div>
                            <div>
                                <span class="tag">${translateStatus(b.status)}</span>
                                <span class="tag tag-genre">${escapeHtml(b.genre || 'Ostatní')}</span>
                            </div>
                            <div class="rating-stars">${starsHtml}</div>
                        </div>
                        <div>
                            <div style="display:flex; justify-content:space-between; font-size:10px; color:#666; margin-bottom:2px;">
                                <span>Str. ${b.currentPage} / ${b.totalPages}</span>
                                <span>${pct}%</span>
                            </div>
                            <div class="progress-container"><div class="progress-fill" style="width: ${pct}%;"></div></div>
                            <div style="display:flex; gap:6px; margin-top:6px;">
                                <button class="icon-btn" onclick="updatePages(${index})" title="Rychlé přičtení stran"><i class="fas fa-plus"></i></button>
                                <button class="icon-btn" onclick="openEditModal(${index})" title="Upravit knihu"><i class="fas fa-pen"></i></button>
                                <button class="icon-btn" onclick="deleteBook(${index})" title="Smazat"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function openEditModal(index) {
            let b = books[index];
            document.getElementById('edit-index').value = index;
            document.getElementById('edit-title').value = b.title;
            document.getElementById('edit-author').value = b.author;
            document.getElementById('edit-cover').value = b.cover || '';
            document.getElementById('edit-genre').value = b.genre || 'Beletrie';
            document.getElementById('edit-pages').value = b.totalPages;
            document.getElementById('edit-current-pages').value = b.currentPage;
            document.getElementById('edit-status').value = b.status;
            document.getElementById('edit-rating').value = b.rating || 0;
            
            document.getElementById('edit-modal').classList.add('active');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.remove('active');
        }

        function saveEditedBook() {
            let index = parseInt(document.getElementById('edit-index').value);
            let title = document.getElementById('edit-title').value.trim();
            let author = document.getElementById('edit-author').value.trim();
            let cover = document.getElementById('edit-cover').value.trim();
            let genre = document.getElementById('edit-genre').value;
            let totalPages = parseInt(document.getElementById('edit-pages').value) || 1;
            let currentPage = parseInt(document.getElementById('edit-current-pages').value) || 0;
            let status = document.getElementById('edit-status').value;
            let rating = parseInt(document.getElementById('edit-rating').value);

            if(!title || !author) { alert("Název a autor nesmí být prázdné!"); return; }
            if(currentPage > totalPages) currentPage = totalPages;

            books[index] = { title, author, cover, genre, totalPages, currentPage, status, rating };
            persistAndRefresh();
            closeEditModal();
        }

        function rateBook(index, rating) {
            books[index].rating = rating;
            persistAndRefresh();
        }

        function translateStatus(status) {
            if(status === 'reading') return 'Čtu';
            if(status === 'tbr') return 'Chci číst';
            if(status === 'read') return 'Přečteno';
            return status;
        }

        function saveManual() {
            const title = document.getElementById('m-title').value.trim();
            const author = document.getElementById('m-author').value.trim();
            const cover = document.getElementById('m-cover').value.trim();
            const genre = document.getElementById('m-genre').value;
            const pages = parseInt(document.getElementById('m-pages').value) || 300;
            const status = document.getElementById('m-status').value;
            const rating = parseInt(document.getElementById('m-rating').value);

            if(!title || !author) { alert("Vyplň název a autora!"); return; }

            books.push({ title, author, genre, totalPages: pages, currentPage: status === 'read' ? pages : 0, status, rating, cover });
            persistAndRefresh();
            document.getElementById('m-title').value = '';
            document.getElementById('m-author').value = '';
            document.getElementById('m-cover').value = '';
            switchTab('knihovna', document.querySelectorAll('.nav-item')[1]);
        }

        async function searchOL() {
            const query = document.getElementById('search-input').value.trim();
            const resultsBox = document.getElementById('search-results');
            if(!query) return;

            resultsBox.style.display = 'block';
            resultsBox.innerHTML = '<p style="font-size:11px; color:#888; padding:8px;">Hledám...</p>';

            try {
                const res = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(query)}&limit=4`);
                const data = await res.json();

                if(!data.docs || data.docs.length === 0) {
                    resultsBox.innerHTML = '<p style="font-size:11px; color:#888; padding:8px;">Nic nenalezeno.</p>';
                    return;
                }

                resultsBox.innerHTML = data.docs.map(doc => {
                    const title = doc.title || 'Neznámý';
                    const author = doc.author_name ? doc.author_name.join(', ') : 'Neznámý';
                    const coverUrl = doc.cover_i ? `https://covers.openlibrary.org/b/id/${doc.cover_i}-M.jpg` : '';
                    const pages = doc.number_of_pages_median || 300;

                    return `
                        <div class="search-result-item" onclick='addBookFromSearch(${JSON.stringify(title)}, ${JSON.stringify(author)}, ${pages}, ${JSON.stringify(coverUrl)})'>
                            <img src="${coverUrl || 'https://via.placeholder.com/35x50?text=?'}" style="width:35px; height:50px; object-fit:cover; border-radius:4px;">
                            <div>
                                <div style="font-size:12px; font-weight:700;">${escapeHtml(title)}</div>
                                <div style="font-size:10px; color:#666;">${escapeHtml(author)}</div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                resultsBox.innerHTML = '<p style="font-size:11px; color:red; padding:8px;">Chyba.</p>';
            }
        }

        function addBookFromSearch(title, author, pages, coverUrl) {
            books.push({ title, author, genre: "Beletrie", totalPages: pages, currentPage: 0, status: "tbr", rating: 0, cover: coverUrl });
            persistAndRefresh();
            document.getElementById('search-results').style.display = 'none';
            document.getElementById('search-input').value = '';
            switchTab('knihovna', document.querySelectorAll('.nav-item')[1]);
        }

        function updatePages(index) {
            let b = books[index];
            let input = prompt(`Aktuální strana (max ${b.totalPages}):`, b.currentPage);
            if(input !== null) {
                let val = parseInt(input);
                if(!isNaN(val) && val >= 0 && val <= b.totalPages) {
                    b.currentPage = val;
                    if(val === b.totalPages) b.status = 'read';
                    persistAndRefresh();
                } else alert("Neplatná hodnota.");
            }
        }

        function deleteBook(index) {
            if(confirm("Smazat knihu?")) { books.splice(index, 1); persistAndRefresh(); }
        }

        function editGoal() {
            let input = prompt("Nový roční cíl (počet knih):", targetGoal);
            if(input !== null && !isNaN(parseInt(input)) && parseInt(input) > 0) {
                targetGoal = parseInt(input);
                localStorage.setItem('knihomol_goal', targetGoal);
                renderGoalProgress();
            }
        }

        function saveProfile() {
            profile.name = document.getElementById('prof-name').value.trim() || "Čtenář";
            profile.bio = document.getElementById('prof-bio').value.trim();
            const urlInput = document.getElementById('prof-avatar-url').value.trim();
            if(urlInput) profile.avatar = urlInput;

            localStorage.setItem('knihomol_user_profile', JSON.stringify(profile));
            document.getElementById('welcome-msg').textContent = `Ahoj, ${profile.name}! ✨`;
            updateAvatarDisplay(profile.avatar, profile.name);
            alert("Uloženo!");
        }

        function updateAvatarDisplay(avatarUrl, name) {
            const el = document.getElementById('avatar-img-el');
            if(avatarUrl) {
                el.style.backgroundImage = `url('${avatarUrl}')`;
                el.style.backgroundSize = 'cover';
                el.textContent = '';
            } else {
                el.style.backgroundImage = 'none';
                el.textContent = (name || 'Č').charAt(0).toUpperCase();
            }
        }

        function persistAndRefresh() {
            localStorage.setItem('knihomol_books', JSON.stringify(books));
            renderEverything();
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        renderEverything();
    </script>
</body>
</html>
