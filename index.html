<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knihomol 📚</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #FF6B6B; --secondary: #4ECDC4; --dark: #292F36;
            --gradient: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%);
            --card-bg: #ffffff; --shadow: 0 10px 30px rgba(0,0,0,0.08); --radius: 24px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: #f0f3f8; color: var(--dark); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .app-container { width: 100%; max-width: 900px; height: 90vh; max-height: 900px; background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; border: 1px solid rgba(0,0,0,0.04); }
        header { padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; background: white; border-bottom: 1px solid #f0f2f5; flex-shrink: 0; }
        .logo { font-size: 22px; font-weight: 700; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        nav { display: flex; gap: 8px; flex-wrap: wrap; }
        .nav-btn { background: #f4f6f9; border: none; padding: 10px 18px; border-radius: 14px; font-weight: 600; font-size: 13px; color: #666; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .nav-btn:hover { background: #e9ecef; color: var(--dark); }
        .nav-btn.active { background: var(--gradient); color: white; box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3); }
        
        main { flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; gap: 20px; background: #fafbfc; }
        .tab-content { display: none; flex-direction: column; gap: 20px; }
        .tab-content.active { display: flex; }

        /* KARTY KNIH JAKO NA VZORU */
        .books-list { display: flex; flex-direction: column; gap: 16px; }
        .book-card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); display: flex; gap: 20px; border: 1px solid #edf0f5; position: relative; transition: 0.2s; }
        .book-card:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(0,0,0,0.06); }
        .book-cover { width: 95px; height: 140px; border-radius: 12px; object-fit: cover; background: #e9ecef; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .book-info { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 6px; min-width: 0; }
        
        .book-title { font-size: 18px; font-weight: 700; color: var(--dark); }
        .book-author { font-size: 14px; color: #666; font-weight: 500; }
        
        .badges { display: flex; gap: 8px; align-items: center; margin: 4px 0; flex-wrap: wrap; }
        .badge { font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px; display: inline-flex; align-items: center; gap: 6px; }
        .badge-reading { background: #e0f2fe; color: #0284c7; }
        .badge-read { background: #dcfce7; color: #16a34a; }
        .badge-want { background: #fef9c3; color: #ca8a04; }
        .badge-genre { background: #f3e8ff; color: #9333ea; }

        .book-progress-info { font-size: 12px; color: #777; margin-top: 4px; display: flex; justify-content: space-between; }
        .progress-bar-bg { width: 100%; height: 6px; background: #edf0f5; border-radius: 10px; overflow: hidden; margin-top: 6px; }
        .progress-bar-fill { height: 100%; background: var(--gradient); border-radius: 10px; transition: width 0.4s ease; }

        .delete-icon { position: absolute; top: 20px; right: 20px; background: #fff1f2; border: none; color: #e11d48; width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .delete-icon:hover { background: #ffe4e6; }

        /* FORMULÁŘ A OSTATNÍ */
        .card-box { background: white; border-radius: 20px; padding: 24px; border: 1px solid #edf0f5; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        .input-field { width: 100%; padding: 12px 16px; border-radius: 14px; border: 2px solid #edf0f5; font-size: 14px; outline: none; background: #fafbfc; transition: 0.2s; }
        .input-field:focus { border-color: var(--primary); background: white; }
        .btn-main { background: var(--gradient); color: white; border: none; padding: 12px 20px; border-radius: 14px; font-weight: 600; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3); transition: 0.2s; }
        .btn-main:hover { opacity: 0.95; transform: translateY(-1px); }
        .btn-secondary { background: #e9ecef; color: #495057; border: none; padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 13px; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .btn-secondary:hover { background: #dee2e6; }
    </style>

    <script>
        let books = [];

        window.addEventListener('DOMContentLoaded', () => {
            loadFromStorage();
            renderBooks();
            updateStats();
        });

        function loadFromStorage() {
            const saved = localStorage.getItem('knihomol_perfect_books');
            if (saved) {
                books = JSON.parse(saved);
            } else {
                // Výchozí ukázková kniha, ať to hned hezky vypadá
                books = [{
                    id: '1',
                    title: 'Kavárna s vůní perníčků',
                    author: 'Gilmore Laurie',
                    status: 'reading',
                    genre: 'Romance',
                    currentPages: 96,
                    totalPages: 285,
                    startDate: '3.9.2026',
                    cover: 'https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=300'
                }];
                saveToStorage();
            }
        }

        function saveToStorage() {
            localStorage.setItem('knihomol_perfect_books', JSON.stringify(books));
        }

        // Open Library API vyhledávání
        window.searchOpenLibrary = async function() {
            const query = document.getElementById('b-title').value.trim();
            if(!query) { alert("Zadej název knihy pro vyhledání."); return; }

            const btn = document.getElementById('api-btn');
            btn.textContent = "Hledám...";
            btn.disabled = true;

            try {
                const res = await fetch(`https://openlibrary.org/search.json?title=${encodeURIComponent(query)}`);
                const data = await res.json();
                
                if(data.docs && data.docs.length > 0) {
                    const b = data.docs[0];
                    if(b.title) document.getElementById('b-title').value = b.title;
                    if(b.author_name) document.getElementById('b-author').value = b.author_name[0];
                    if(b.subject) document.getElementById('b-genre').value = b.subject[0];
                    if(b.number_of_pages_median) document.getElementById('b-total').value = b.number_of_pages_median;
                    if(b.cover_i) {
                        document.getElementById('b-cover').value = `https://covers.openlibrary.org/b/id/${b.cover_i}-M.jpg`;
                    }
                    alert("Úspěšně dohledáno z Open Library!");
                } else {
                    alert("Kniha nebyla v Open Library nalezena.");
                }
            } catch(e) {
                console.error(e);
                alert("Chyba připojení k API.");
            } finally {
                btn.innerHTML = '<i class="fas fa-search"></i> Open Library';
                btn.disabled = false;
            }
        };

        window.addBook = function() {
            const title = document.getElementById('b-title').value.trim();
            const author = document.getElementById('b-author').value.trim();
            const status = document.getElementById('b-status').value;
            const genre = document.getElementById('b-genre').value.trim();
            const currentPages = parseInt(document.getElementById('b-current').value) || 0;
            const totalPages = parseInt(document.getElementById('b-total').value) || 0;
            const cover = document.getElementById('b-cover').value.trim();
            
            const today = new Date();
            const startDate = `${today.getDate()}. ${today.getMonth() + 1}. ${today.getFullYear()}`;

            if(!title || !author) { alert("Vyplň název a autora!"); return; }

            const newBook = {
                id: Date.now().toString(),
                title, author, status, genre, currentPages, totalPages, startDate,
                cover: cover || 'https://via.placeholder.com/95x140?text=Kniha'
            };

            books.unshift(newBook);
            saveToStorage();
            renderBooks();
            updateStats();

            // Reset formuláře
            document.getElementById('b-title').value = '';
            document.getElementById('b-author').value = '';
            document.getElementById('b-genre').value = '';
            document.getElementById('b-current').value = '0';
            document.getElementById('b-total').value = '';
            document.getElementById('b-cover').value = '';

            switchTab('knihovna', document.querySelector('nav button:nth-child(2)'));
        };

        window.deleteBook = function(id) {
            if(!confirm("Opravdu smazat tuto knihu?")) return;
            books = books.filter(b => b.id !== id);
            saveToStorage();
            renderBooks();
            updateStats();
        };

        function renderBooks() {
            const list = document.getElementById('books-list');
            if(books.length === 0) {
                list.innerHTML = '<p style="color: #777; text-align: center; padding: 30px;">Zatím nemáš v knihovně žádné knihy.</p>';
                return;
            }

            list.innerHTML = books.map(b => {
                const percent = b.totalPages > 0 ? Math.min(100, Math.round((b.currentPages / b.totalPages) * 100)) : 0;
                let statusBadge = '';
                if(b.status === 'reading') statusBadge = '<span class="badge badge-reading"><i class="fas fa-book-open"></i> Právě čtu</span>';
                else if(b.status === 'read') statusBadge = '<span class="badge badge-read"><i class="fas fa-check"></i> Přečteno</span>';
                else statusBadge = '<span class="badge badge-want"><i class="fas fa-clock"></i> Chci číst</span>';

                return `
                    <div class="book-card">
                        <img src="${b.cover}" class="book-cover" onerror="this.src='https://via.placeholder.com/95x140?text=Kniha'">
                        <div class="book-info">
                            <div class="book-title">${escapeHtml(b.title)}</div>
                            <div class="book-author">${escapeHtml(b.author)}</div>
                            <div class="badges">
                                ${statusBadge}
                                ${b.genre ? `<span class="badge badge-genre">${escapeHtml(b.genre)}</span>` : ''}
                            </div>
                            ${b.status === 'reading' ? `
                                <div style="font-size: 11px; color: #888; margin-top: 2px;">Začátek čtení: ${b.startDate}</div>
                                <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${percent}%"></div></div>
                                <div class="book-progress-info">
                                    <span>${b.currentPages} /${b.totalPages > 0 ? b.totalPages : '?'} stran</span>
                                    <span>${percent}%</span>
                                </div>
                            ` : ''}
                        </div>
                        <button class="delete-icon" onclick="deleteBook('${b.id}')" title="Smazat"><i class="fas fa-trash"></i></button>
                    </div>
                `;
            }).join('');
        }

        function updateStats() {
            document.getElementById('stat-total').textContent = books.length;
            document.getElementById('stat-read').textContent = books.filter(b => b.status === 'read').length;
            document.getElementById('stat-reading').textContent = books.filter(b => b.status === 'reading').length;
        }

        function escapeHtml(str) {
            return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo" onclick="switchTab('knihovna', document.querySelector('nav button:nth-child(2)'))">
                <i class="fas fa-book-open"></i> Knihomol
            </div>
            <nav>
                <button class="nav-btn active" onclick="switchTab('knihovna', this)"><i class="fas fa-layer-group"></i> Knihovna</button>
                <button class="nav-btn" onclick="switchTab('pridat', this)"><i class="fas fa-plus-circle"></i> Přidat knihu</button>
            </nav>
        </header>
        
        <main>
            <!-- TAB: KNIHOVNA -->
            <div id="tab-knihovna" class="tab-content active">
                <!-- Rychlé statistiky -->
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;">
                    <div class="card-box" style="padding: 16px; text-align: center;">
                        <div style="font-size: 11px; font-weight: 600; color: #888;">CELKEM</div>
                        <div id="stat-total" style="font-size: 22px; font-weight: 700; color: var(--primary);">0</div>
                    </div>
                    <div class="card-box" style="padding: 16px; text-align: center;">
                        <div style="font-size: 11px; font-weight: 600; color: #888;"> PŘEČTENO</div>
                        <div id="stat-read" style="font-size: 22px; font-weight: 700; color: #16a34a;">0</div>
                    </div>
                    <div class="card-box" style="padding: 16px; text-align: center;">
                        <div style="font-size: 11px; font-weight: 600; color: #888;">PRÁVĚ ČTU</div>
                        <div id="stat-reading" style="font-size: 22px; font-weight: 700; color: #0284c7;">0</div>
                    </div>
                </div>

                <div id="books-list" class="books-list">
                    <!-- Sem se dynamicky generují karty -->
                </div>
            </div>

            <!-- TAB: PŘIDAT KNIHU -->
            <div id="tab-pridat" class="tab-content">
                <div class="card-box" style="max-width: 600px; margin: 0 auto; width: 100%;">
                    <h3 style="font-size: 18px; margin-bottom: 15px;"><i class="fas fa-plus-circle" style="color: var(--primary);"></i> Přidat novou knihu</h3>
                    <div style="display: flex; flex-direction: column; gap: 14px;">
                        <div>
                            <label style="font-size: 11px; font-weight: 600; color: #777;">NÁZEV KNIHY *</label>
                            <div style="display: flex; gap: 8px; margin-top: 4px;">
                                <input type="text" id="b-title" class="input-field" placeholder="např. Letní válka">
                                <button type="button" id="api-btn" class="btn-secondary" onclick="searchOpenLibrary()"><i class="fas fa-search"></i> Open Library</button>
                            </div>
                        </div>
                        <div>
                            <label style="font-size: 11px; font-weight: 600; color: #777;">AUTOR *</label>
                            <input type="text" id="b-author" class="input-field" style="margin-top: 4px;" placeholder="např. Naomi Noviková">
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                            <div>
                                <label style="font-size: 11px; font-weight: 600; color: #777;">STAV ČTENÍ</label>
                                <select id="b-status" class="input-field" style="margin-top: 4px;">
                                    <option value="reading">Právě čtu</option>
                                    <option value="want">Chci číst</option>
                                    <option value="read">Přečteno</option>
                                </select>
                            </div>
                            <div>
                                <label style="font-size: 11px; font-weight: 600; color: #777;">ŽÁNR</label>
                                <input type="text" id="b-genre" class="input-field" style="margin-top: 4px;" placeholder="např. Fantasy">
                            </div>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                            <div>
                                <label style="font-size: 11px; font-weight: 600; color: #777;">PŘEČTENO STRAN</label>
                                <input type="number" id="b-current" class="input-field" style="margin-top: 4px;" value="0">
                            </div>
                            <div>
                                <label style="font-size: 11px; font-weight: 600; color: #777;">CELKEM STRAN</label>
                                <input type="number" id="b-total" class="input-field" style="margin-top: 4px;" placeholder="např. 350">
                            </div>
                        </div>
                        <div>
                            <label style="font-size: 11px; font-weight: 600; color: #777;">URL OBRÁZKU PŘEBALU</label>
                            <input type="url" id="b-cover" class="input-field" style="margin-top: 4px;" placeholder="Doplní se automaticky přes API">
                        </div>
                        <button class="btn-main" onclick="addBook()" style="margin-top: 5px;"><i class="fas fa-check"></i> Uložit knihu do knihovny</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        function switchTab(id, btn) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + id).classList.add('active');
            if(btn) btn.classList.add('active');
        }
    </script>
</body>
</html>
